[project]
name = "ninho"
version = "0.13.1"
description = "NINHO — Plataforma de Engenharia, Modelagem Dimensional, Camada Semântica e Governança de Dados (Oracle/ODI/Hop/Power BI)."
readme = "README.md"
requires-python = ">=3.10"
# Os motores usam apenas a biblioteca padrão. Extras opcionais abaixo.
dependencies = []

[project.optional-dependencies]
# Leitura nativa de planilhas .xlsx na Governança (há fallback sem openpyxl).
governanca = ["openpyxl>=3.1"]
# Parsing seguro de XML de terceiros (ODI, Hop, PBIX, DOCX). Usado se instalado.
seguranca = ["defusedxml>=0.7"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["core/scripts_comuns", "."]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 140
extend-exclude = [".agents/skills/*/templates", "modulos/*/templates", "saida", "entrega"]

[tool.ruff.lint]
# Base mínima obrigatória no CI: erros de sintaxe, nomes indefinidos, imports
# não usados e armadilhas comuns. Amplie gradualmente (ver PLANO_MELHORIAS.md).
select = ["E9", "F", "B006", "B008"]
# Variáveis locais não usadas ficam como dívida conhecida (revisar ao refatorar cada motor).
ignore = ["F841"]

[tool.ruff.lint.mccabe]
max-complexity = 25
